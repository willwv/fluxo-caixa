services:
  lancamentos-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${LANCAMENTOS_DB_USER}
      POSTGRES_PASSWORD: ${LANCAMENTOS_DB_PASSWORD}
      POSTGRES_DB: ${LANCAMENTOS_DB_NAME}
    ports:
      - "5433:5432" # acesso via cliente desktop (DBeaver, Azure Data Studio, etc.) - uso local/dev
    volumes:
      - lancamentos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANCAMENTOS_DB_USER} -d ${LANCAMENTOS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Primary do Consolidado - recebe as escritas do consumer (via incremento atômico).
  consolidado-db-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CONSOLIDADO_DB_USER}
      POSTGRES_PASSWORD: ${CONSOLIDADO_DB_PASSWORD}
      POSTGRES_DB: ${CONSOLIDADO_DB_NAME}
      REPLICATION_USER: ${CONSOLIDADO_REPLICATION_USER}
      REPLICATION_PASSWORD: ${CONSOLIDADO_REPLICATION_PASSWORD}
    ports:
      - "5434:5432" # acesso via cliente desktop - uso local/dev
    volumes:
      - consolidado_db_primary_data:/var/lib/postgresql/data
      - ./docker/postgres/primary-init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONSOLIDADO_DB_USER} -d ${CONSOLIDADO_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Read replica do Consolidado - streaming replication física a partir do primary (pg_basebackup
  # no primeiro start); o relatório lê daqui. Ver docker/postgres/replica-entrypoint.sh.
  consolidado-db-replica:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CONSOLIDADO_DB_USER}
      POSTGRES_PASSWORD: ${CONSOLIDADO_DB_PASSWORD}
      POSTGRES_DB: ${CONSOLIDADO_DB_NAME}
      REPLICATION_USER: ${CONSOLIDADO_REPLICATION_USER}
      REPLICATION_PASSWORD: ${CONSOLIDADO_REPLICATION_PASSWORD}
      PRIMARY_HOST: consolidado-db-primary
    entrypoint: ["sh", "/scripts/replica-entrypoint.sh"]
    ports:
      - "5435:5432" # acesso via cliente desktop - uso local/dev
    volumes:
      - consolidado_db_replica_data:/var/lib/postgresql/data
      - ./docker/postgres/replica-entrypoint.sh:/scripts/replica-entrypoint.sh:ro
    depends_on:
      consolidado-db-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONSOLIDADO_DB_USER} -d ${CONSOLIDADO_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672" # painel de administração (http://localhost:15672)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ACL (Redis 6+) em vez de só "--requirepass": separa o usuário "default" (acesso total, só para
  # ferramentas de inspeção/humanos) do usuário do Consolidado (acesso de leitura/escrita restrito
  # ao seu próprio namespace de chaves "consolidado:*", sem comandos administrativos/perigosos).
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --user
      - default
      - "on"
      - ">${REDIS_ADMIN_PASSWORD}"
      - "~*"
      - "&*"
      - "+@all"
      - --user
      - "${REDIS_APP_USER}"
      - "on"
      - ">${REDIS_APP_PASSWORD}"
      - "~consolidado:*"
      - "-@all"
      - "+@read"
      - "+@write"
      - "+@connection"
      - "-@dangerous"
    ports:
      - "6379:6379" # acesso via cliente desktop (RedisInsight, etc.) - uso local/dev
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_ADMIN_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  lancamentos-api:
    build:
      context: .
      dockerfile: src/Lancamentos/FluxoCaixa.Lancamentos.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__LancamentosDb: "Host=lancamentos-db;Port=5432;Database=${LANCAMENTOS_DB_NAME};Username=${LANCAMENTOS_DB_USER};Password=${LANCAMENTOS_DB_PASSWORD}"
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: FluxoCaixa.Lancamentos
      Jwt__Audience: FluxoCaixa
      Jwt__ExpirationHours: "1"
      PasswordHash__Pepper: ${PASSWORD_PEPPER}
      SeedUser__Username: ${SEED_USER_USERNAME}
      SeedUser__Password: ${SEED_USER_PASSWORD}
    ports:
      - "5001:8080"
    depends_on:
      lancamentos-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  consolidado-api:
    build:
      context: .
      dockerfile: src/Consolidado/FluxoCaixa.Consolidado.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ConsolidadoPrimaryDb: "Host=consolidado-db-primary;Port=5432;Database=${CONSOLIDADO_DB_NAME};Username=${CONSOLIDADO_DB_USER};Password=${CONSOLIDADO_DB_PASSWORD}"
      ConnectionStrings__ConsolidadoReplicaDb: "Host=consolidado-db-replica;Port=5432;Database=${CONSOLIDADO_DB_NAME};Username=${CONSOLIDADO_DB_USER};Password=${CONSOLIDADO_DB_PASSWORD}"
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Redis__ConnectionString: "redis:6379,user=${REDIS_APP_USER},password=${REDIS_APP_PASSWORD}"
      Redis__TtlSeconds: "5"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: FluxoCaixa.Lancamentos
      Jwt__Audience: FluxoCaixa
    ports:
      - "5002:8080"
    depends_on:
      consolidado-db-primary:
        condition: service_healthy
      consolidado-db-replica:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Ferramentas de inspeção (dev only) ---
  # Não fazem parte da arquitetura da solução - só facilitam acompanhar os dados durante o
  # desenvolvimento/avaliação. RabbitMQ já tem painel próprio exposto acima (localhost:15672).

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080" # http://localhost:8080 - selecione "PostgreSQL", host = nome do serviço
                     # (lancamentos-db, consolidado-db-primary ou consolidado-db-replica)
    depends_on:
      - lancamentos-db
      - consolidado-db-primary
      - consolidado-db-replica

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: "local:redis:6379:0:${REDIS_ADMIN_PASSWORD}"
    ports:
      - "8081:8081" # http://localhost:8081
    depends_on:
      - redis

  # k6 (teste de carga, ver README "Testes de carga (k6)") - "profiles" garante que este serviço
  # NUNCA sobe com um "docker-compose up" comum, só quando chamado explicitamente com
  # "--profile loadtest". Declarar o volume aqui (em vez de "-v $PWD/..." na linha de comando)
  # evita a pegadinha de sintaxe de path que muda entre bash/PowerShell/cmd.exe - o Compose
  # resolve "./loadtest/k6" relativo a este arquivo, não ao shell de quem chama.
  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    volumes:
      - ./loadtest/k6:/scripts
    environment:
      SEED_USERNAME: ${SEED_USER_USERNAME}
      SEED_PASSWORD: ${SEED_USER_PASSWORD}

volumes:
  lancamentos_db_data:
  consolidado_db_primary_data:
  consolidado_db_replica_data:
